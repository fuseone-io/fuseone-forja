# Forja contract for this repository (PRD v1 shape, adapted).
# Provisional: the phase-0 pilot is still a human decision. See docs/adr/.
# Read by the control plane from the base commit, never from the agent's tree.
version: 1
image: golang:1.25

setup:
  - go mod download
  # make lint needs golangci-lint on PATH; the CI pins v2.15.0.
  # v2.15.0 declares go 1.26.0 in its go.mod, so this step depends on the
  # toolchain switch working under golang:1.25. forja.doctor decides.
  - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0

# Sidecars on the run network, reached by name, started only before a gate
# that needs them. Trust instead of a password: no secret in the repository.
services:
  postgres:
    image: postgres:16
    env:
      POSTGRES_HOST_AUTH_METHOD: trust

# No private dependency: go.mod resolves entirely through proxy.golang.org.
registries: []

# Order matters; every gate must exit 0. The commands are the Makefile's own.
gates:
  - name: build
    run: make build
  - name: vet
    run: make vet
  - name: lint
    run: make lint
  - name: test
    run: make test
  - name: race
    run: make race
  # Last, so a red build never waits on a sidecar.
  - name: integration
    run: make integration
    needs: [postgres]

verify:
  exclude: ["**/*.md", "docs/**"]

proof_paths:
  - .forja.yaml
  - Makefile
  - .golangci.yml
  - "**/testdata/**"
  - "**/*_test.go"

# Additions count here, unlike proof_paths. GNU make reads GNUmakefile, then
# makefile, before Makefile: adding either one replaces every gate above.
human_merge_paths:
  - .github/**
  - GNUmakefile
  - makefile

limits:
  wall_clock: 30m
  max_diff_lines: 400

agent_context:
  - CLAUDE.md
  - CONTRIBUTING.md
  - docs/
